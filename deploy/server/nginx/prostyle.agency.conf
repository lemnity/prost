# Кэш фото товаров, перекодированных в WebP (/api/img): каждое фото конвертируется один раз
proxy_cache_path /var/cache/nginx/imgs levels=1:2 keys_zone=imgs:20m max_size=2g inactive=90d use_temp_path=off;

# Кэш фото gifts.ru (их сервер обрывает загрузку картинок с чужих сайтов — отдаём через себя)
proxy_cache_path /var/cache/nginx/gifts levels=1:2 keys_zone=gifts:10m max_size=1g inactive=30d use_temp_path=off;

# prostyle.agency — Next.js (systemd: prostyle.service, порт 3010)
server {
    listen 80;
    listen [::]:80;
    server_name prostyle.agency www.prostyle.agency;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://prostyle.agency$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.prostyle.agency;
    ssl_certificate     /etc/letsencrypt/live/prostyle.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostyle.agency/privkey.pem;
    return 301 https://prostyle.agency$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prostyle.agency;

    ssl_certificate     /etc/letsencrypt/live/prostyle.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostyle.agency/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Сборка Next.js: неизменяемые файлы с хэшем — прямо с диска.
    # Фото товаров gifts.ru через наш сервер: без заголовков браузера (Sec-Fetch-*, Referer), с кэшем на 30 дней.
    # Конвертер фото в WebP (/api/img в Next): ответы кэшируются, повторно не конвертируются.
    location ^~ /api/img {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_cache imgs;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 365d;
        proxy_cache_valid 302 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache $upstream_cache_status;
    }

    location ^~ /gifts-img/ {
        proxy_pass https://files.gifts.ru/reviewer/;
        proxy_ssl_server_name on;
        proxy_set_header Host files.gifts.ru;
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header Sec-Fetch-Mode "";
        proxy_set_header Sec-Fetch-Dest "";
        proxy_set_header Sec-Fetch-User "";
        proxy_cache gifts;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache $upstream_cache_status;
    }

    location ^~ /_next/static/ {
        alias /opt/prostyle/current/.next-prod/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
