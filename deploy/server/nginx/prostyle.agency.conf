# prostyle.agency — Next.js (systemd: prostyle.service, порт 3010)
server {
    listen 80;
    listen [::]:80;
    server_name prostyle.agency www.prostyle.agency;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://prostyle.agency$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.prostyle.agency;
    ssl_certificate     /etc/letsencrypt/live/prostyle.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostyle.agency/privkey.pem;
    return 301 https://prostyle.agency$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prostyle.agency;

    ssl_certificate     /etc/letsencrypt/live/prostyle.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostyle.agency/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Сборка Next.js: неизменяемые файлы с хэшем — прямо с диска.
    location ^~ /_next/static/ {
        alias /opt/prostyle/current/.next-prod/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
